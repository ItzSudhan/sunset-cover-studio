<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <header class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div>
        <h1>Sunset Cover Studio</h1>
        <p>Your photos → crime-epic poster → PNG</p>
      </div>
    </header>

    <section>
      <h2><span>1</span> Photos</h2>
      <label class="drop">
        <input id="photoInput" type="file" accept="image/*" multiple>
        <strong>Add photos</strong><small>or drop them anywhere</small>
      </label>
      <div id="thumbs" class="thumbs"></div>
      <div class="row">
        <button id="mixAll" type="button" class="ghost">Deal across panels</button>
        <button id="spreadAll" type="button" class="ghost">Spread one photo</button>
      </div>
    </section>

    <section>
      <h2><span>2</span> Layout &amp; size</h2>
      <div id="layouts" class="chips"></div>
      <div id="sizes" class="chips sizes"></div>
    </section>

    <section>
      <h2><span>3</span> Colour grade</h2>
      <div id="grades" class="chips grades"></div>
      <label class="slider">Grade strength <input id="intensity" type="range" min="0" max="1" step="0.01" value="1"></label>
      <div class="toggles">
        <label><input id="fx-sun" type="checkbox" checked> Sun</label>
        <label><input id="fx-palms" type="checkbox" checked> Palms</label>
        <label><input id="fx-halftone" type="checkbox" checked> Halftone</label>
        <label><input id="fx-grain" type="checkbox" checked> Grain</label>
      </div>
    </section>

    <section>
      <h2><span>4</span> Caption</h2>
      <label class="field">Title <small>(Enter for a new line)</small>
        <textarea id="title" rows="2" maxlength="40">Sunset
Streets</textarea>
      </label>
      <label class="field">Tagline
        <input id="tagline" type="text" maxlength="48" value="Coming this summer">
      </label>
    </section>
  </aside>

  <main class="stagearea">
    <div class="toolbar">
      <strong id="panelLabel">Panel 1</strong>
      <label class="slider inline">Zoom <input id="zoom" type="range" min="1" max="4" step="0.01" value="1"></label>
      <label class="check"><input id="span" type="checkbox"> Span poster</label>
      <button id="resetPanel" type="button" class="ghost">Reset crop</button>
      <span class="grow"></span>
      <button id="downloadAll" type="button" class="ghost">All 3 sizes</button>
      <button id="download" type="button" class="primary">Download PNG</button>
    </div>
    <div id="previewWrap" class="preview-wrap">
      <canvas id="preview" aria-label="Live preview of the cover. Click a panel to select it, drag to pan, scroll to zoom."></canvas>
    </div>
    <p class="hint">Click a panel, then a photo to place it · drag to pan · scroll to zoom · <span id="status" role="status"></span></p>
  </main>
</div>
<script type="module" src="./src/editor.js"></script>
</body>
</html>
